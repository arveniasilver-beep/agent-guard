[project]
name = "agent-guard"
version = "0.3.0"
description = "DeerFlow icin zorlayici tehlikeli-komut onay kapisi"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3,<2",
    "langgraph>=1.2.9,<1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_guard"]
